<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Post Blog - Mini Blog</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1 style="text-align: left; padding-left: 20px; font-size: 48px;">Doggie Diaries</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="login.html">Login</a>
      <a href="post.html">Post</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <section style="
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
      text-align: center;
      padding: 2rem;
    ">
      <h2>Create a New Blog Post</h2>
  
      <form id="post-form" style="
        width: 90%;
        max-width: 600px;
        padding: 20px;
        border: 1px solid #ccc;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        background-color: #f9f9f9;
        text-align: left;
      ">
        <label for="title" style="display: block; margin-bottom: 5px;">Title:</label>
        <input type="text" id="title" name="title" required style="width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 5px; border: 1px solid #ccc;" />
  
        <label for="content" style="display: block; margin-bottom: 5px;">Content:</label>
        <textarea id="content" name="content" rows="6" required style="width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 5px; border: 1px solid #ccc;"></textarea>
  
        <button type="submit" style="width: 100%; padding: 10px; background-color: #4CAF50; color: white; border: none; border-radius: 5px;">Post</button>
      </form>
  
      <p id="post-message" style="color: green; margin-top: 1rem;"></p>
    </section>
  </main>
  
  <script src="script.js"></script>
</body>
</html>
